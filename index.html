<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TILIVIZO_BLBAS - Vertical Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --accent: #f0b90b; --bg: #050505; --side: #0f0f12; --item-bg: rgba(255,255,255,0.03); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { height: 50px; background: #000; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #222; justify-content: space-between; }
        .logo { font-weight: bold; color: var(--accent); font-size: 1.1rem; }

        .main-container { flex: 1; display: flex; overflow: hidden; }

        /* ستوونی گرووپەکان - لای ڕاست */
        .groups-sidebar { 
            width: 160px; 
            background: #000; 
            border-left: 1px solid #222; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column;
        }
        .group-item { 
            padding: 15px 10px; 
            text-align: center; 
            font-size: 0.8rem; 
            cursor: pointer; 
            border-bottom: 1px solid #111; 
            color: #888;
            transition: 0.3s;
        }
        .group-item.active { background: var(--accent); color: #000; font-weight: bold; }
        .group-item:hover:not(.active) { background: #111; color: #fff; }

        /* ستوونی کەناڵەکان - ناوەڕاست */
        .channels-sidebar { 
            width: 280px; 
            background: var(--side); 
            border-left: 1px solid #222; 
            overflow-y: auto; 
            padding: 10px;
        }
        .ch-item { 
            display: flex; 
            align-items: center; 
            padding: 10px; 
            gap: 10px; 
            margin-bottom: 8px; 
            background: var(--item-bg); 
            border-radius: 8px; 
            cursor: pointer; 
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .ch-item:hover { background: rgba(255,255,255,0.08); }
        .ch-item.active { border-color: var(--accent); background: rgba(240, 185, 11, 0.1); }
        .ch-item img { width: 40px; height: 40px; border-radius: 4px; background: #fff; object-fit: contain; }
        .ch-info h4 { font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .ch-info p { font-size: 0.7rem; color: #555; }

        /* بەشی ڤیدیۆ - لای چەپ */
        .player-area { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Scrollbar Design */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; }
            .groups-sidebar { width: 100%; height: 50px; flex-direction: row; border-left: none; border-bottom: 1px solid #222; }
            .channels-sidebar { width: 100%; height: 200px; border-left: none; }
            .player-area { height: 40vh; }
            .group-item { padding: 0 15px; display: flex; align-items: center; border-bottom: none; border-left: 1px solid #111; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">TILIVIZO_BLBAS</div>
    <div id="count" style="font-size: 0.75rem; color: #555;">0 Channels</div>
</header>

<div class="main-container">
    <div class="player-area">
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="channels-sidebar" id="channelList">
        <div style="text-align:center; padding-top:50px; color:#444;">Select a Group...</div>
    </div>

    <div class="groups-sidebar" id="groupList"></div>
</div>

<script>
    const video = document.getElementById('videoPlayer');
    let hls = new Hls();
    let allChannels = [];

    async function loadData() {
        const url = 'https://raw.githubusercontent.com/serverblbas-svg/TILIVIZO_BLBAS/main/serverblbas_m3u8.m3u';
        try {
            const res = await fetch(url);
            const text = await res.text();
            const lines = text.split('\n');
            allChannels = [];
            let ch = null;

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const name = line.split(',')[1] || "Unnamed";
                    const g = line.match(/group-title="([^"]+)"/i);
                    const l = line.match(/tvg-logo="([^"]+)"/i);
                    ch = { name: name.trim(), group: g ? g[1] : "General", logo: l ? l[1] : "" };
                } else if (line.startsWith('http') && ch) {
                    ch.url = line;
                    allChannels.push(ch);
                    ch = null;
                }
            });

            document.getElementById('count').innerText = allChannels.length + " کەناڵ";
            renderGroups();
            filterG("هەمووی"); // بۆ ئەوەی لە سەرەتادا هەمووی پیشان بدات
        } catch (e) {
            console.error(e);
        }
    }

    function renderGroups() {
        const gs = ["هەمووی", ...new Set(allChannels.map(c => c.group))];
        const container = document.getElementById('groupList');
        container.innerHTML = gs.map((g, i) => 
            `<div class="group-item ${g==='هەمووی'?'active':''}" onclick="filterG('${g}', this)">${g}</div>`
        ).join('');
    }

    function renderChannels(data) {
        const container = document.getElementById('channelList');
        container.innerHTML = data.map(c => `
            <div class="ch-item" onclick="play('${c.url}', '${c.name}', this)">
                <img src="${c.logo || 'https://logo.m3uassets.com/a.png'}" onerror="this.src='https://logo.m3uassets.com/a.png'">
                <div class="ch-info">
                    <h4>${c.name}</h4>
                    <p>${c.group}</p>
                </div>
            </div>
        `).join('');
        container.scrollTop = 0;
    }

    function play(url, name, el) {
        document.querySelectorAll('.ch-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            video.src = url; video.play();
        }
    }

    function filterG(g, btn) {
        if(btn) {
            document.querySelectorAll('.group-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        const filtered = g === "هەمووی" ? allChannels : allChannels.filter(c => c.group === g);
        renderChannels(filtered);
    }

    loadData();
</script>
</body>
</html>
