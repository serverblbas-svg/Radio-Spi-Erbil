<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TILIVIZO QURAN PRO 🌙</title>
    <style>
        :root { --primary: #1b4332; --accent: #d4af37; --bg: #050a08; --text: #f8f9fa; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { height: 60px; background: var(--primary); display: flex; align-items: center; padding: 0 20px; border-bottom: 2px solid var(--accent); justify-content: space-between; }
        .clock { font-family: monospace; font-size: 1.2rem; color: var(--accent); }

        .main { flex: 1; display: flex; overflow: hidden; }

        /* Player Area */
        .player-container { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; }
        .v-info { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 8px; border-right: 4px solid var(--accent); }

        /* Sidebar */
        .sidebar { width: 420px; background: #0a1310; display: flex; flex-direction: column; border-right: 1px solid var(--accent); }
        .upload-area { padding: 15px; background: var(--primary); display: flex; gap: 10px; }
        .btn { flex: 1; background: var(--accent); color: #000; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; cursor: pointer; font-size: 0.8rem; }

        .list-container { flex: 1; overflow-y: auto; padding: 10px; }
        .item { 
            display: flex; flex-direction: column; padding: 12px; background: rgba(255,255,255,0.05); 
            border-radius: 8px; margin-bottom: 8px; cursor: pointer; border-right: 3px solid transparent; 
        }
        .item.active { background: var(--accent); color: #000; border-right-color: #fff; }
        .item .name { font-weight: bold; font-size: 0.9rem; margin-bottom: 5px; }
        .item .time-info { font-size: 0.75rem; opacity: 0.8; display: flex; justify-content: space-between; }

        .empty-msg { text-align: center; margin-top: 50px; opacity: 0.5; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold;">پەخشی خەتمی قورئان 📖</div>
    <div class="clock" id="liveClock">00:00:00</div>
</header>

<div class="main">
    <div class="player-container">
        <div class="v-info" id="currentInfo">ئامادەیە بۆ بارکردن...</div>
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="sidebar">
        <div class="upload-area">
            <label class="btn">
                📁 بارکردنی ڤیدیۆکان
                <input type="file" id="fileInput" accept="video/*" multiple style="display:none">
            </label>
        </div>
        
        <div class="list-container" id="videoList">
            <div class="empty-msg">تکایە فایلەکان هەڵبژێرە</div>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('videoPlayer');
    const listContainer = document.getElementById('videoList');
    const liveClock = document.getElementById('liveClock');
    const currentInfo = document.getElementById('currentInfo');
    
    let playlist = [];

    // نوێکردنەوەی کاتژمێری سەرەوە
    setInterval(() => {
        const now = new Date();
        liveClock.innerText = now.toLocaleTimeString('en-GB');
    }, 1000);

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        // ڕیزکردن و زیادکردن بۆ لیستە نەک سڕینەوە
        const newItems = files.map(file => ({
            name: file.name.replace(/\.[^/.]+$/, ""),
            url: URL.createObjectURL(file),
            duration: 0 // دواتر پڕ دەکرێتەوە
        }));

        playlist = [...playlist, ...newItems];
        updateDurationsAndRender();
    });

    async function updateDurationsAndRender() {
        for (let item of playlist) {
            if (item.duration === 0) {
                item.duration = await getVideoDuration(item.url);
            }
        }
        renderList();
        if (video.paused && !video.src && playlist.length > 0) playVideo(0);
    }

    function getVideoDuration(url) {
        return new Promise(resolve => {
            const tempVid = document.createElement('video');
            tempVid.src = url;
            tempVid.onloadedmetadata = () => resolve(tempVid.duration);
        });
    }

    function renderList() {
        let startTime = new Date();
        listContainer.innerHTML = playlist.map((vid, i) => {
            const startStr = startTime.toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit'});
            const endTime = new Date(startTime.getTime() + vid.duration * 1000);
            const endStr = endTime.toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit'});
            
            const html = `
                <div class="item ${video.dataset.currentIndex == i ? 'active' : ''}" onclick="playVideo(${i})">
                    <div class="name">${vid.name}</div>
                    <div class="time-info">
                        <span>دەستپێک: ${startStr}</span>
                        <span>کۆتایی: ${endStr}</span>
                    </div>
                </div>
            `;
            startTime = endTime; // بۆ ڤیدیۆی دواتر
            return html;
        }).join('');
    }

    function playVideo(index) {
        if (index >= playlist.length) return;
        
        video.dataset.currentIndex = index;
        video.src = playlist[index].url;
        video.play();
        currentInfo.innerText = "ئێستا: " + playlist[index].name;
        renderList();
    }

    video.onended = () => {
        let next = parseInt(video.dataset.currentIndex) + 1;
        if (next < playlist.length) {
            playVideo(next);
        } else {
            currentInfo.innerText = "هەموو ڤیدیۆکان تەواو بوون";
        }
    };

    function formatTime(s) {
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        return `${h>0?h+':':''}${m<10?'0'+m:m}:${Math.floor(s%60)<10?'0'+Math.floor(s%60):Math.floor(s%60)}`;
    }
</script>
</body>
</html>
