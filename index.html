<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TILIVIZO ULTRA PRO - All-in-One 🚀</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --accent: #f0b90b; --bg: #050505; --card: #111; --border: #222; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 60px; background: #000; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); justify-content: space-between; }
        .logo { font-weight: bold; color: var(--accent); font-size: 1.4rem; letter-spacing: 1px; }
        .upload-btn { background: var(--accent); color: black; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: 0.3s; }
        .upload-btn:hover { background: #fff; transform: scale(1.05); }

        .main { flex: 1; display: flex; overflow: hidden; }
        
        /* Player Area */
        .player-container { flex: 1; background: #000; display: flex; flex-direction: column; position: relative; }
        video { width: 100%; height: 100%; background: #000; outline: none; }
        .video-title { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 5px; font-size: 0.8rem; color: var(--accent); z-index: 10; pointer-events: none; }

        /* Sidebar Design */
        .sidebar { width: 480px; background: #0a0a0a; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .search-box { padding: 15px; background: #111; border-bottom: 1px solid var(--border); }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; outline: none; transition: 0.3s; text-align: right; }
        input:focus { border-color: var(--accent); }

        .content-area { flex: 1; display: flex; overflow: hidden; }

        /* Vertical Groups Column */
        .groups-column { width: 150px; background: #0d0d0d; border-left: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; padding: 8px; gap: 6px; }
        .btn-g { padding: 12px 8px; background: #1a1a1a; border-radius: 6px; cursor: pointer; font-size: 0.75rem; text-align: center; transition: 0.2s; border: 1px solid transparent; color: #aaa; }
        .btn-g.active { background: var(--accent); color: black; font-weight: bold; border-color: var(--accent); }
        .btn-g:hover:not(.active) { background: #252525; color: white; }

        /* Channels/Videos Column */
        .channels-column { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .item { display: flex; align-items: center; padding: 10px; gap: 12px; background: #111; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .item:hover { background: #1a1a1a; transform: translateX(-3px); }
        .item.active { border-color: var(--accent); background: rgba(240, 185, 11, 0.1); }
        .item img { width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 6px; }
        .item h4 { font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; color: #eee; text-align: right; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>

<header>
    <div class="logo">TILIVIZO ULTRA 🚀</div>
    <label class="upload-btn">
        📁 بارکردنی (M3U یان ڤیدیۆکان)
        <input type="file" id="fileInput" accept=".m3u,.mp4,.mkv,.webm,.mov" multiple style="display:none">
    </label>
</header>

<div class="main">
    <div class="player-container">
        <div class="video-title" id="videoTitle">ئامادەیە بۆ پەخش...</div>
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="sidebar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="گەڕان بۆ کەناڵ یان ڤیدیۆ..." oninput="filterChannels()">
        </div>
        
        <div class="content-area">
            <div class="groups-column" id="groupList">
                <div class="btn-g active">هەمووی</div>
            </div>
            
            <div class="channels-column" id="channelList">
                <div style="text-align:center; color:#555; margin-top:50px; font-size:0.8rem;">
                    <p>هیچ فایلێک بار نەکراوە</p>
                    <p style="font-size:0.65rem; margin-top:10px;">فایلی M3U یان کۆمەڵێک ڤیدیۆ هەڵبژێرە</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let allChannels = [];
    let currentFilter = "هەمووی";
    const video = document.getElementById('videoPlayer');
    const vTitle = document.getElementById('videoTitle');
    let hls = new Hls();

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        const m3uFile = files.find(f => f.name.toLowerCase().endsWith('.m3u'));
        const videoFiles = files.filter(f => !f.name.toLowerCase().endsWith('.m3u'));

        if (m3uFile) {
            const reader = new FileReader();
            reader.onload = function(event) {
                parseM3U(event.target.result);
                if (videoFiles.length > 0) addLocalVideos(videoFiles, false);
            };
            reader.readAsText(m3uFile);
        } else {
            allChannels = []; // پاککردنەوە ئەگەر تەنها ڤیدیۆ بوو
            addLocalVideos(videoFiles, true);
        }
    });

    function addLocalVideos(files, shouldRender) {
        const localItems = files.map(file => ({
            name: file.name,
            group: "ڤیدیۆ ناوخۆییەکان 📁",
            url: URL.createObjectURL(file),
            logo: "https://cdn-icons-png.flaticon.com/512/1179/1179069.png",
            isLocal: true
        }));
        
        allChannels = [...allChannels, ...localItems];
        renderGroups();
        displayChannels(allChannels);
        vTitle.innerText = "فایلەکان بارکران ✅";
    }

    function parseM3U(data) {
        const lines = data.split('\n');
        let m3uChannels = [];
        let currentItem = null;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line.startsWith('#EXTINF:')) {
                const name = line.split(',')[1] || "کەناڵ";
                const group = line.match(/group-title="([^"]+)"/i);
                const logo = line.match(/tvg-logo="([^"]+)"/i);
                currentItem = {
                    name: name.trim(),
                    group: group ? group[1] : "گشتی",
                    logo: logo ? logo[1] : "https://logo.m3uassets.com/a.png",
                    isLocal: false
                };
            } else if (line.startsWith('http') && currentItem) {
                currentItem.url = line.trim();
                m3uChannels.push(currentItem);
                currentItem = null;
            }
        }
        allChannels = [...m3uChannels, ...allChannels];
        renderGroups();
        displayChannels(allChannels);
    }

    function renderGroups() {
        const gs = ["هەمووی", ...new Set(allChannels.map(c => c.group))];
        const container = document.getElementById('groupList');
        container.innerHTML = gs.map(g => `
            <div class="btn-g ${g===currentFilter?'active':''}" onclick="setGroup('${g}', this)">
                ${g}
            </div>
        `).join('');
    }

    function displayChannels(channels) {
        const list = document.getElementById('channelList');
        const fragment = document.createDocumentFragment();
        const toShow = channels.slice(0, 250); // نیشاندانی ٢٥٠ دانەی سەرەتا بۆ خێرایی

        toShow.forEach(c => {
            const div = document.createElement('div');
            div.className = 'item';
            div.onclick = function() { playItem(c.url, c.name, div, c.isLocal); };
            div.innerHTML = `
                <img src="${c.logo}" loading="lazy" onerror="this.src='https://logo.m3uassets.com/a.png'">
                <h4>${c.name}</h4>
            `;
            fragment.appendChild(div);
        });

        list.innerHTML = "";
        list.appendChild(fragment);
        list.scrollTop = 0;
    }

    function playItem(url, name, el, isLocal) {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        vTitle.innerText = (isLocal ? "ڤیدیۆ: " : "کەناڵ: ") + name;

        if (hls) hls.destroy();

        if (!isLocal && url.includes('m3u8')) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            video.src = url;
            video.play();
        }
    }

    function filterChannels() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allChannels.filter(c => 
            (currentFilter === "هەمووی" || c.group === currentFilter) &&
            c.name.toLowerCase().includes(query)
        );
        displayChannels(filtered);
    }

    function setGroup(g, btn) {
        currentFilter = g;
        document.querySelectorAll('.btn-g').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterChannels();
    }
</script>
</body>
</html>
