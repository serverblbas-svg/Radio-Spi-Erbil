<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خەتمی قورئانی پیرۆز 🌙</title>
    <style>
        :root { --primary: #1b4332; --accent: #d4af37; --bg: #081c15; --text: #f8f9fa; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        header { 
            height: 70px; 
            background: var(--primary); 
            display: flex; 
            align-items: center; 
            padding: 0 30px; 
            border-bottom: 2px solid var(--accent); 
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .logo { font-size: 1.6rem; font-weight: bold; color: var(--accent); letter-spacing: 1px; }

        .main { flex: 1; display: flex; overflow: hidden; }

        /* بەشی ڤیدیۆ */
        .player-container { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
        video { width: 95%; height: 90%; border-radius: 15px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); }
        .v-info { position: absolute; top: 25px; right: 40px; background: rgba(8, 28, 21, 0.8); padding: 10px 20px; border-radius: 8px; border-right: 4px solid var(--accent); color: var(--accent); font-weight: bold; }

        /* سایدبار بۆ لیستی سوورەتەکان */
        .sidebar { width: 400px; background: #0a1310; display: flex; flex-direction: column; border-right: 1px solid rgba(212, 175, 55, 0.2); }
        
        .upload-section { padding: 15px; background: var(--primary); border-bottom: 1px solid var(--accent); }
        .upload-btn { display: block; width: 100%; background: var(--accent); color: #000; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .upload-btn:hover { background: #fff; }

        .list-container { flex: 1; overflow-y: auto; padding: 15px; }
        .item { 
            display: flex; 
            align-items: center; 
            padding: 15px; 
            gap: 15px; 
            background: rgba(255,255,255,0.03); 
            border-radius: 10px; 
            margin-bottom: 10px; 
            cursor: pointer; 
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .item:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--accent); }
        .item.active { background: var(--accent); color: #000; font-weight: bold; }
        
        .num { font-size: 1.2rem; opacity: 0.7; }
        .name { flex: 1; font-size: 1rem; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo">خەتمی قورئانی پیرۆز 📖</div>
</header>

<div class="main">
    <div class="player-container">
        <div class="v-info" id="vInfo">بۆ دەستپێکردن، خەتمەکە بار بکە</div>
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="sidebar">
        <div class="upload-section">
            <label class="upload-btn">
                📁 بارکردنی خەتمەکە (هەموو ڤیدیۆکان)
                <input type="file" id="fileInput" accept="video/*" multiple style="display:none">
            </label>
        </div>
        
        <div class="list-container" id="videoList">
            <p style="text-align:center; color:#555; margin-top:50px;">فایلەکان دیاری بکە بۆ دروستکردنی لیستەکە</p>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('videoPlayer');
    const vInfo = document.getElementById('vInfo');
    const listContainer = document.getElementById('videoList');
    let videoQueue = [];

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        // ڕیزکردنی فایلەکان بەپێی ناو (بۆ ئەوەی سوورەتەکان تێکەڵ نەبن)
        files.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

        videoQueue = files.map((file, index) => ({
            name: file.name.replace(/\.[^/.]+$/, ""), // لادانی پاشگری .mp4
            url: URL.createObjectURL(file),
            index: index + 1
        }));

        renderList();
        if (videoQueue.length > 0) playVideo(0);
    });

    function renderList() {
        listContainer.innerHTML = videoQueue.map((vid, i) => `
            <div class="item" id="vid-${i}" onclick="playVideo(${i})">
                <span class="num">${vid.index}</span>
                <span class="name">${vid.name}</span>
            </div>
        `).join('');
    }

    function playVideo(index) {
        // لادانی چالاکی لە لیستەکە
        document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
        
        const currentVid = videoQueue[index];
        video.src = currentVid.url;
        video.play();
        
        // چالاککردنی تەنزیم لە لیستەکە
        const activeEl = document.getElementById(`vid-${index}`);
        if (activeEl) {
            activeEl.classList.add('active');
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        vInfo.innerText = "ئێستا دەخوێنرێت: " + currentVid.name;
        video.dataset.currentIndex = index;
    }

    // ئۆتۆماتیک چوون بۆ ڤیدیۆی داهاتوو
    video.onended = function() {
        let currentIndex = parseInt(video.dataset.currentIndex);
        let nextIndex = currentIndex + 1;
        
        if (nextIndex < videoQueue.length) {
            playVideo(nextIndex);
        } else {
            vInfo.innerText = "خەتمەکە کۆتایی هات - سوپاس بۆ خوا";
        }
    };
</script>
</body>
</html>
