<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TILIVIZO ULTRA - Vertical Groups</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --accent: #f0b90b; --bg: #050505; --card: #111; --border: #222; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 50px; background: #000; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); justify-content: space-between; }
        .logo { font-weight: bold; color: var(--accent); font-size: 1.2rem; }
        .upload-btn { background: var(--accent); color: black; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }

        .main { flex: 1; display: flex; overflow: hidden; }
        
        /* پلەیەر */
        .player-container { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; background: #000; }

        /* سایدباری نوێ - ستوونی */
        .sidebar { width: 450px; background: #0a0a0a; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        
        .search-box { padding: 10px; background: #111; border-bottom: 1px solid var(--border); }
        input { width: 100%; padding: 10px; background: #000; border: 1px solid #333; color: white; border-radius: 5px; outline: none; }

        .content-area { flex: 1; display: flex; overflow: hidden; }

        /* ستوونی گرووپەکان */
        .groups-column { width: 140px; background: #0d0d0d; border-left: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; padding: 5px; gap: 5px; }
        .btn-g { padding: 10px; background: #1a1a1a; border-radius: 5px; cursor: pointer; font-size: 0.75rem; text-align: center; transition: 0.2s; border: 1px solid transparent; word-wrap: break-word; }
        .btn-g.active { background: var(--accent); color: black; font-weight: bold; }
        .btn-g:hover:not(.active) { background: #252525; }

        /* ستوونی کەناڵەکان */
        .channels-column { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .item { display: flex; align-items: center; padding: 8px; gap: 10px; background: #111; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
        .item:hover { background: #1a1a1a; }
        .item.active { border-color: var(--accent); background: rgba(240, 185, 11, 0.1); }
        .item img { width: 35px; height: 35px; object-fit: contain; background: #fff; border-radius: 4px; }
        .item h4 { font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

        /* Scrollbar Style */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>

<header>
    <div class="logo">TILIVIZO ULTRA 🚀</div>
    <label class="upload-btn">
        📁 بارکردنی فایلەکە
        <input type="file" id="fileInput" accept=".m3u" style="display:none">
    </label>
</header>

<div class="main">
    <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="sidebar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="بگەڕێ بۆ کەناڵ..." oninput="filterChannels()">
        </div>
        
        <div class="content-area">
            <div class="groups-column" id="groupList"></div>
            
            <div class="channels-column" id="channelList">
                <p style="text-align:center; color:#555; margin-top:20px;">تکایە فایلێک باربکە...</p>
            </div>
        </div>
    </div>
</div>

<script>
    let allChannels = [];
    let currentFilter = "هەمووی";
    const video = document.getElementById('videoPlayer');
    let hls = new Hls();

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            parseM3U(event.target.result);
        };
        reader.readAsText(file);
    });

    function parseM3U(data) {
        const lines = data.split('\n');
        allChannels = [];
        let currentItem = null;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line.startsWith('#EXTINF:')) {
                const name = line.split(',')[1] || "کەناڵ";
                const group = line.match(/group-title="([^"]+)"/i);
                const logo = line.match(/tvg-logo="([^"]+)"/i);
                currentItem = {
                    name: name.trim(),
                    group: group ? group[1] : "گشتی",
                    logo: logo ? logo[1] : "https://via.placeholder.com/40"
                };
            } else if (line.startsWith('http') && currentItem) {
                currentItem.url = line.trim();
                allChannels.push(currentItem);
                currentItem = null;
            }
        }
        renderGroups();
        displayChannels(allChannels);
    }

    function renderGroups() {
        const gs = ["هەمووی", ...new Set(allChannels.map(c => c.group))];
        const container = document.getElementById('groupList');
        container.innerHTML = gs.map(g => `
            <div class="btn-g ${g===currentFilter?'active':''}" onclick="setGroup('${g}', this)">
                ${g}
            </div>
        `).join('');
    }

    function displayChannels(channels) {
        const list = document.getElementById('channelList');
        const fragment = document.createDocumentFragment();
        const toShow = channels.slice(0, 150); // بۆ خێرایی

        toShow.forEach(c => {
            const div = document.createElement('div');
            div.className = 'item';
            div.onclick = function() { play(c.url, div); };
            div.innerHTML = `
                <img src="${c.logo}" onerror="this.src='https://via.placeholder.com/40'">
                <h4>${c.name}</h4>
            `;
            fragment.appendChild(div);
        });

        list.innerHTML = "";
        list.appendChild(fragment);
        list.scrollTop = 0;
    }

    function filterChannels() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allChannels.filter(c => 
            (currentFilter === "هەمووی" || c.group === currentFilter) &&
            c.name.toLowerCase().includes(query)
        );
        displayChannels(filtered);
    }

    function setGroup(g, btn) {
        currentFilter = g;
        document.querySelectorAll('.btn-g').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterChannels();
    }

    function play(url, el) {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            video.src = url;
            video.play();
        }
    }
</script>
</body>
</html>
