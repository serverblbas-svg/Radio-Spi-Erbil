<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TILIVIZO ULTRA PRO 🚀</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --accent: #f0b90b; --bg: #050505; --card: #111; --border: #222; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 60px; background: #000; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); justify-content: space-between; }
        .logo { font-weight: bold; color: var(--accent); font-size: 1.4rem; letter-spacing: 1px; }
        .upload-btn { background: var(--accent); color: black; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: 0.3s; }
        .upload-btn:hover { background: #fff; transform: scale(1.05); }

        .main { flex: 1; display: flex; overflow: hidden; }
        
        /* Player Area */
        .player-container { flex: 1; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        video { width: 100%; height: 100%; background: #000; outline: none; }
        .video-title { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 5px; font-size: 0.8rem; color: var(--accent); pointer-events: none; }

        /* Sidebar Design */
        .sidebar { width: 480px; background: #0a0a0a; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        
        .search-box { padding: 15px; background: #111; border-bottom: 1px solid var(--border); }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); }

        .content-area { flex: 1; display: flex; overflow: hidden; }

        /* Vertical Groups Column */
        .groups-column { width: 150px; background: #0d0d0d; border-left: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; padding: 8px; gap: 6px; }
        .btn-g { padding: 12px 8px; background: #1a1a1a; border-radius: 6px; cursor: pointer; font-size: 0.75rem; text-align: center; transition: 0.2s; border: 1px solid transparent; color: #aaa; }
        .btn-g.active { background: var(--accent); color: black; font-weight: bold; border-color: var(--accent); }
        .btn-g:hover:not(.active) { background: #252525; color: white; }

        /* Channels Column */
        .channels-column { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .item { display: flex; align-items: center; padding: 10px; gap: 12px; background: #111; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .item:hover { background: #1a1a1a; transform: translateX(-3px); }
        .item.active { border-color: var(--accent); background: rgba(240, 185, 11, 0.1); }
        .item img { width: 42px; height: 42px; object-fit: contain; background: #fff; border-radius: 6px; padding: 2px; }
        .item h4 { font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; color: #eee; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>

<header>
    <div class="logo">TILIVIZO ULTRA 🚀</div>
    <label class="upload-btn">
        📁 بارکردنی فایل (M3U / ڤیدیۆ)
        <input type="file" id="fileInput" accept=".m3u,.mp4,.mkv,.webm,.mov" style="display:none">
    </label>
</header>

<div class="main">
    <div class="player-container">
        <div class="video-title" id="videoTitle">ئامادەیە بۆ پەخش...</div>
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="sidebar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="گەڕان لەناو کەناڵەکان..." oninput="filterChannels()">
        </div>
        
        <div class="content-area">
            <div class="groups-column" id="groupList">
                <div class="btn-g active">هەمووی</div>
            </div>
            
            <div class="channels-column" id="channelList">
                <div style="text-align:center; color:#555; margin-top:50px; font-size:0.9rem;">
                    <p>هیچ فایلێک بار نەکراوە</p>
                    <p style="font-size:0.7rem; margin-top:10px;">فایلی M3U یان ڤیدیۆ هەڵبژێرە</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let allChannels = [];
    let currentFilter = "هەمووی";
    const video = document.getElementById('videoPlayer');
    const vTitle = document.getElementById('videoTitle');
    let hls = new Hls();

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // ئەگەر فایلەکە لیست بوو
        if (file.name.toLowerCase().endsWith('.m3u')) {
            const reader = new FileReader();
            reader.onload = function(event) {
                parseM3U(event.target.result);
                vTitle.innerText = "لیستی کەناڵەکان بارکرا ✅";
            };
            reader.readAsText(file);
        } 
        // ئەگەر فایلی ڤیدیۆ بوو
        else {
            const videoUrl = URL.createObjectURL(file);
            playLocalVideo(videoUrl, file.name);
        }
    });

    function playLocalVideo(url, name) {
        if (hls) hls.destroy();
        video.src = url;
        video.play();
        vTitle.innerText = "پەخشکردنی ڤیدیۆ: " + name;
        
        // پاککردنەوەی لیستەکە کاتێک ڤیدیۆیەک لێ دەدرێت
        document.getElementById('channelList').innerHTML = `
            <div style="padding:20px; text-align:center; color:var(--accent); font-size:0.8rem;">
                تۆ ئێستا سەیری ڤیدیۆیەکی ناوخۆیی دەکەیت<br><br>
                <b>${name}</b>
            </div>`;
    }

    function parseM3U(data) {
        const lines = data.split('\n');
        allChannels = [];
        let currentItem = null;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line.startsWith('#EXTINF:')) {
                const name = line.split(',')[1] || "کەناڵ";
                const group = line.match(/group-title="([^"]+)"/i);
                const logo = line.match(/tvg-logo="([^"]+)"/i);
                currentItem = {
                    name: name.trim(),
                    group: group ? group[1] : "گشتی",
                    logo: logo ? logo[1] : "https://logo.m3uassets.com/a.png"
                };
            } else if (line.startsWith('http') && currentItem) {
                currentItem.url = line.trim();
                allChannels.push(currentItem);
                currentItem = null;
            }
        }
        renderGroups();
        displayChannels(allChannels);
    }

    function renderGroups() {
        const gs = ["هەمووی", ...new Set(allChannels.map(c => c.group))];
        const container = document.getElementById('groupList');
        container.innerHTML = gs.slice(0, 100).map(g => `
            <div class="btn-g ${g===currentFilter?'active':''}" onclick="setGroup('${g}', this)">
                ${g}
            </div>
        `).join('');
    }

    function displayChannels(channels) {
        const list = document.getElementById('channelList');
        const fragment = document.createDocumentFragment();
        // نیشاندانی تەنها ٢٠٠ دانە بۆ خێرایی یەکجار زۆر
        const toShow = channels.slice(0, 200); 

        toShow.forEach(c => {
            const div = document.createElement('div');
            div.className = 'item';
            div.onclick = function() { playStream(c.url, c.name, div); };
            div.innerHTML = `
                <img src="${c.logo}" loading="lazy" onerror="this.src='https://logo.m3uassets.com/a.png'">
                <h4>${c.name}</h4>
            `;
            fragment.appendChild(div);
        });

        list.innerHTML = "";
        list.appendChild(fragment);
        list.scrollTop = 0;
    }

    function filterChannels() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allChannels.filter(c => 
            (currentFilter === "هەمووی" || c.group === currentFilter) &&
            c.name.toLowerCase().includes(query)
        );
        displayChannels(filtered);
    }

    function setGroup(g, btn) {
        currentFilter = g;
        document.querySelectorAll('.btn-g').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterChannels();
    }

    function playStream(url, name, el) {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        vTitle.innerText = "کەناڵ: " + name;

        if (Hls.isSupported() && url.includes('m3u8')) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            if (hls) hls.destroy();
            video.src = url;
            video.play();
        }
    }
</script>
</body>
</html>
