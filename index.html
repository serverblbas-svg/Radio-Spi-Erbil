<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMAL PRO ULTRA - Luxury IPTV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --primary: #f0b90b;
            --bg: #05080a;
            --card: rgba(255, 255, 255, 0.05);
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* پلەیەر */
        .player-wrapper {
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--primary);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video { width: 100%; aspect-ratio: 16/9; display: block; }

        .info-bar {
            padding: 12px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            color: var(--primary);
            font-weight: bold;
            border-top: 1px solid rgba(240, 185, 11, 0.2);
        }

        /* گروپەکان */
        .groups-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: thin;
        }

        .group-btn {
            background: var(--card);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }

        .group-btn.active {
            background: var(--primary);
            color: black;
            font-weight: bold;
        }

        /* گەڕان */
        .search-box {
            width: 100%;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid rgba(240, 185, 11, 0.3);
            background: var(--card);
            color: white;
            margin-bottom: 20px;
            outline: none;
            font-size: 1rem;
        }

        /* لیستی کەناڵەکان */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .channel-card {
            background: var(--card);
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .channel-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            background: rgba(240, 185, 11, 0.05);
        }

        .channel-card.active {
            background: var(--primary);
            color: black;
        }

        .channel-card img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 8px;
            background: white;
            border-radius: 8px;
            padding: 5px;
        }

        .channel-card span {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #666;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="player-wrapper">
        <video id="videoPlayer" controls autoplay poster="https://wallpaperaccess.com/full/1567831.jpg"></video>
        <div class="info-bar" id="currentChannel">تکایە کەناڵێک هەڵبژێرە</div>
    </div>

    <div class="groups-container" id="groupList">
        </div>

    <input type="text" id="searchBox" class="search-box" placeholder="🔍 گەڕان بۆ ناوی کەناڵ...">

    <div class="channel-grid" id="channelList">
        </div>

    <footer>✨ KAMAL PRO ULTRA | Powered by HLS.js ✨</footer>
</div>

<script>
    const video = document.getElementById('videoPlayer');
    let hls = new Hls();
    let allChannels = [];

    // خوێندنەوەی فایلی M3U
    async function fetchM3U() {
        try {
            // چونکە npx serve بەکاردێنیت، ڕاستەوخۆ ناوی فایلەکە بنووسە
            const response = await fetch('serverblbas_m3u8.m3u');
            if (!response.ok) throw new Error();
            const data = await response.text();
            parseM3U(data);
        } catch (err) {
            // ئەگەر لە لۆکاڵ نەبوو، هەوڵبدە لە گیتھەب بیخوێنێتەوە
            try {
                const response = await fetch('https://raw.githubusercontent.com/serverblbas-svg/serverblbas_m3u8/master/serverblbas_m3u8.m3u');
                const data = await response.text();
                parseM3U(data);
            } catch (e) {
                document.getElementById('currentChannel').innerText = "❌ هەڵە لە بارکردنی لیستەکە";
            }
        }
    }

    function parseM3U(content) {
        const lines = content.split('\n');
        let currentCh = {};
        allChannels = [];
        
        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith('#EXTINF:')) {
                const name = line.split(',')[1] || "کەناڵی بێ ناو";
                const group = line.match(/group-title="([^"]+)"/i);
                const logo = line.match(/tvg-logo="([^"]+)"/i);
                currentCh = {
                    name: name.trim(),
                    group: group ? group[1] : "گشتی",
                    logo: logo ? logo[1] : "https://logo.m3uassets.com/a.png"
                };
            } else if (line.startsWith('http')) {
                currentCh.url = line;
                allChannels.push(currentCh);
                currentCh = {};
            }
        });
        renderGroups();
        renderChannels(allChannels);
    }

    function renderGroups() {
        const groups = ["هەمووی", ...new Set(allChannels.map(ch => ch.group))];
        const container = document.getElementById('groupList');
        container.innerHTML = groups.map((g, index) => 
            `<button class="group-btn ${index === 0 ? 'active' : ''}" onclick="filterByGroup('${g}', this)">${g}</button>`
        ).join('');
    }

    function renderChannels(list) {
        const container = document.getElementById('channelList');
        container.innerHTML = list.map(ch => `
            <div class="channel-card" onclick="playStream('${ch.url}', '${ch.name}', this)">
                <img src="${ch.logo}" onerror="this.src='https://logo.m3uassets.com/a.png'">
                <span>${ch.name}</span>
            </div>
        `).join('');
    }

    function playStream(url, name, el) {
        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('currentChannel').innerText = "🎬 " + name;

        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
    }

    function filterByGroup(group, btn) {
        document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filtered = group === "هەمووی" ? allChannels : allChannels.filter(ch => ch.group === group);
        renderChannels(filtered);
    }

    document.getElementById('searchBox').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(val)));
    };

    fetchM3U();
</script>

</body>
</html>
