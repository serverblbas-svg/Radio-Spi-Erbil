<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TILIVIZO LIVE TV 📺</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --accent: #f0b90b; --bg: #050505; --card: #111; --border: #222; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 60px; background: #000; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); justify-content: space-between; }
        .logo { font-weight: bold; color: var(--accent); font-size: 1.4rem; letter-spacing: 1px; }
        .live-tag { background: #ff0000; color: white; padding: 3px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; animation: blink 1.5s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.4;} 100% {opacity: 1;} }

        .main { flex: 1; display: flex; overflow: hidden; }
        
        .player-container { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; background: #000; }
        .v-info { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 6px; border-left: 3px solid var(--accent); font-size: 0.85rem; z-index: 10; }

        .sidebar { width: 450px; background: #0a0a0a; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .search-box { padding: 15px; background: #111; border-bottom: 1px solid var(--border); }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; outline: none; text-align: right; }

        .content-area { flex: 1; display: flex; overflow: hidden; }
        .groups-column { width: 140px; background: #0d0d0d; border-left: 1px solid var(--border); overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
        .btn-g { padding: 10px 5px; background: #1a1a1a; border-radius: 6px; cursor: pointer; font-size: 0.7rem; text-align: center; color: #999; transition: 0.2s; }
        .btn-g.active { background: var(--accent); color: black; font-weight: bold; }

        .channels-column { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .item { display: flex; align-items: center; padding: 10px; gap: 12px; background: #111; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
        .item.active { border-color: var(--accent); background: rgba(240, 185, 11, 0.1); }
        .item img { width: 35px; height: 35px; object-fit: contain; background: #fff; border-radius: 4px; }
        .item h4 { font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: right; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo">TILIVIZO <span style="color:white">PRO</span></div>
    <div class="live-tag">LIVE TV</div>
</header>

<div class="main">
    <div class="player-container">
        <div class="v-info" id="vInfo">پەخشی ڕاستەوخۆ...</div>
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="sidebar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="گەڕان بۆ کەناڵ..." oninput="filterChannels()">
        </div>
        
        <div class="content-area">
            <div class="groups-column" id="groupList"></div>
            <div class="channels-column" id="channelList">
                <div style="text-align:center; padding:20px; color:var(--accent)">خەریکی بارکردنی سێرڤەر...</div>
            </div>
        </div>
    </div>
</div>

<script>
    let allChannels = [];
    let currentFilter = "هەمووی";
    const video = document.getElementById('videoPlayer');
    const vInfo = document.getElementById('vInfo');
    let hls = new Hls();

    // فەرمانی سەرەکی بۆ بارکردنی ئۆتۆماتیکی
    async function initTV() {
        const filePath = 'Kanal_Karakan.m3u'; // دڵنیابە ناوی فایلەکەت ڕێک ئەمەیە
        try {
            const res = await fetch(filePath);
            if (!res.ok) throw new Error();
            const data = await res.text();
            parseM3U(data);
        } catch (e) {
            document.getElementById('channelList').innerHTML = 
                `<div style="text-align:center; padding:20px; color:red">❌ هەڵە: فایلی کەناڵەکان (Kanal_Karakan.m3u) نەدۆزرایەوە!</div>`;
        }
    }

    function parseM3U(data) {
        const lines = data.split('\n');
        allChannels = [];
        let currentItem = null;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line.startsWith('#EXTINF:')) {
                const name = line.split(',')[1] || "کەناڵ";
                const group = line.match(/group-title="([^"]+)"/i);
                const logo = line.match(/tvg-logo="([^"]+)"/i);
                currentItem = {
                    name: name.trim(),
                    group: group ? group[1] : "گشتی",
                    logo: logo ? logo[1] : "https://logo.m3uassets.com/a.png"
                };
            } else if (line.startsWith('http') && currentItem) {
                currentItem.url = line.trim();
                allChannels.push(currentItem);
                currentItem = null;
            }
        }
        renderGroups();
        displayChannels(allChannels);
        if(allChannels.length > 0) vInfo.innerText = `ئامادەیە - ${allChannels.length} کەناڵ بارکراوە`;
    }

    function renderGroups() {
        const gs = ["هەمووی", ...new Set(allChannels.map(c => c.group))];
        const container = document.getElementById('groupList');
        container.innerHTML = gs.map(g => `
            <div class="btn-g ${g===currentFilter?'active':''}" onclick="setGroup('${g}', this)">${g}</div>
        `).join('');
    }

    function displayChannels(channels) {
        const list = document.getElementById('channelList');
        const fragment = document.createDocumentFragment();
        const toShow = channels.slice(0, 200); 

        toShow.forEach(c => {
            const div = document.createElement('div');
            div.className = 'item';
            div.onclick = () => playStream(c.url, c.name, div);
            div.innerHTML = `
                <img src="${c.logo}" loading="lazy" onerror="this.src='https://logo.m3uassets.com/a.png'">
                <h4>${c.name}</h4>
            `;
            fragment.appendChild(div);
        });

        list.innerHTML = "";
        list.appendChild(fragment);
    }

    function playStream(url, name, el) {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        vInfo.innerText = "پەخش دەکرێت: " + name;

        if (hls) hls.destroy();

        if (url.includes('m3u8') || url.includes('.ts')) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) vInfo.innerText = "❌ ئەم کەناڵە لەکارکەوتووە";
            });
        } else {
            video.src = url;
            video.play();
        }
    }

    function filterChannels() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allChannels.filter(c => 
            (currentFilter === "هەمووی" || c.group === currentFilter) &&
            c.name.toLowerCase().includes(query)
        );
        displayChannels(filtered);
    }

    function setGroup(g, btn) {
        currentFilter = g;
        document.querySelectorAll('.btn-g').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterChannels();
    }

    // دەستپێکردنی سیستەمەکە پاش کردنەوەی لاپەڕەکە
    window.onload = initTV;
</script>
</body>
</html>
