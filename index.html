<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پەخشی خەتمی قورئانی پیرۆز 🌙</title>
    <style>
        :root { --primary: #1b4332; --accent: #d4af37; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 380px; background: #0a0a0a; border-right: 1px solid var(--accent); display: flex; flex-direction: column; }
        .header-box { padding: 20px; background: var(--primary); text-align: center; border-bottom: 2px solid var(--accent); }
        .list-container { flex: 1; overflow-y: auto; padding: 10px; }
        
        .item { padding: 15px; background: #111; margin-bottom: 8px; border-radius: 8px; cursor: pointer; border-right: 4px solid transparent; font-size: 0.9rem; }
        .item.active { background: var(--accent); color: #000; font-weight: bold; border-right-color: #fff; }

        .player-side { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        video#mainVideo { width: 100%; height: 100%; object-fit: contain; }

        /* لۆجۆی کەناڵ وەک ڤیدیۆ بەبێ ڕەنگی سەوز */
        .channel-logo-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 150px; /* قەبارەی لۆگۆکە */
            height: auto;
            z-index: 100;
            pointer-events: none;
        }
        
        video#logoVideo {
            width: 100%;
            height: auto;
            /* لادانی ڕەنگی سەوزی لۆگۆکە */
            mix-blend-mode: screen; 
            filter: brightness(1.2) contrast(1.1);
        }

        .video-info { position: absolute; top: 20px; right: 20px; background: rgba(27, 67, 50, 0.9); padding: 10px 20px; border-radius: 8px; border-right: 4px solid var(--accent); z-index: 10; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="header-box">
        <h2 id="clock">00:00:00</h2>
        <p style="color: var(--accent); font-size: 0.85rem;">پەخشی خەتمی قورئان</p>
    </div>
    <div class="list-container" id="playlistItems"></div>
</div>

<div class="player-side">
    <div class="channel-logo-container">
        <video id="logoVideo" autoplay loop muted playsinline>
            <source src="https://dso5.raed.net:452/files/111dekanquran.mkv" type="video/mp4">
        </video>
    </div>
    
    <div class="video-info" id="vInfo">ئێستا: بار دەکرێت...</div>
    <video id="mainVideo" controls autoplay></video>
</div>

<script>
    // تەنها ڤیدیۆکانی قورئان لێرە دابنێ
    const playlist = [
        { 
            name: "📖 سوورەتی بەقەرە - هەیسەم ئەلدوخەین", 
            url: "https://dso5.raed.net:452/files/%D8%AA%D9%84%D8%A7%D9%88%D8%A9-%D8%B3%D9%88%D8%B1%D8%A9-%D8%A7%D9%84%D8%B4%D9%8A%D8%AE-%D9%87%D9%8A%D8%AB%D9%85-%D8%A7%D9%84%D8%AF%D8%AE%D9%8A%D9%86-%EF%BD%9C-Surah-Al-Baqarah-Recitation.mkv" 
        }
    ];

    const video = document.getElementById('mainVideo');
    const container = document.getElementById('playlistItems');
    const vInfo = document.getElementById('vInfo');
    
    let currentIndex = parseInt(localStorage.getItem('quran_live_index')) || 0;

    function renderList() {
        container.innerHTML = playlist.map((item, i) => `
            <div class="item ${currentIndex === i ? 'active' : ''}" onclick="playVideo(${i})">
                ${item.name}
            </div>
        `).join('');
    }

    function playVideo(i) {
        if (i >= playlist.length) i = 0;
        currentIndex = i;
        localStorage.setItem('quran_live_index', i);
        video.src = playlist[i].url;
        video.play();
        vInfo.innerText = "ئێستا: " + playlist[i].name;
        renderList();
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB'); }, 1000);
    video.onended = () => { playVideo(currentIndex + 1); };
    window.onload = () => { if (playlist.length > 0) playVideo(currentIndex); };
</script>
</body>
</html>
