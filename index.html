<script>
    const video = document.getElementById('videoPlayer');
    let hls = new Hls();
    let allChannels = [];
    let filteredChannels = [];

    const M3U_URL = 'https://xtream-ie.net/get.php?username=iptv2026&password=iptv2026&type=m3u_plus';

    async function loadFromURL() {
        // ... (هەمان کۆدی پێشووت بۆ UI)
        try {
            const response = await fetch(M3U_URL);
            const data = await response.text();
            parseM3U(data);
            document.getElementById('loadingMsg').classList.add('hidden');
        } catch (err) {
            document.getElementById('loadingMsg').classList.add('hidden');
            document.getElementById('currentChannel').innerText = '❌ CORS Error - فایلی ناوخۆیی بەکاربهێنە';
        }
    }

    function readFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            parseM3U(e.target.result);
            document.getElementById('uploadArea').classList.add('hidden');
        };
        reader.readAsText(file);
    }

    function parseM3U(content) {
        const lines = content.split('\n');
        allChannels = [];
        let currentCh = null;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line.startsWith('#EXTINF:')) {
                const name = line.split(',')[1] || "کەناڵی بێ ناو";
                const group = line.match(/group-title="([^"]+)"/i);
                const logo = line.match(/tvg-logo="([^"]+)"/i);
                currentCh = {
                    name: name,
                    group: group ? group[1] : "گشتی",
                    logo: logo ? logo[1] : "https://logo.m3uassets.com/a.png"
                };
            } else if (line.startsWith('http') && currentCh) {
                currentCh.url = line;
                allChannels.push(currentCh);
                currentCh = null;
            }
        }
        renderGroups();
        filteredChannels = allChannels;
        renderChannels(allChannels.slice(0, 500)); // تەنها ٥٠٠ دانەی سەرەتا نیشان بدە بۆ خێرایی
        document.getElementById('currentChannel').innerText = `✅ ${allChannels.length} کەناڵ ئامادەیە`;
    }

    function renderChannels(list) {
        const container = document.getElementById('channelList');
        const fragment = document.createDocumentFragment(); // زۆر گرنگە بۆ خێرایی
        
        container.innerHTML = ''; // پاککردنەوە

        list.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.onclick = () => playStream(ch.url, ch.name, card);
            card.innerHTML = `
                <img src="${ch.logo}" loading="lazy" onerror="this.src='https://logo.m3uassets.com/a.png'">
                <span>${ch.name}</span>
            `;
            fragment.appendChild(card);
        });

        container.appendChild(fragment);
    }

    function filterByGroup(group, btn) {
        document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        filteredChannels = group === "هەمووی" ? allChannels : allChannels.filter(ch => ch.group === group);
        renderChannels(filteredChannels.slice(0, 500)); // نیشاندانی ٥٠٠ دانە
    }

    document.getElementById('searchBox').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        if (val.length < 2) { 
            renderChannels(filteredChannels.slice(0, 500)); 
            return; 
        }
        const searchResult = filteredChannels.filter(ch => ch.name.toLowerCase().includes(val));
        renderChannels(searchResult.slice(0, 300));
    };

    function playStream(url, name, el) {
        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('currentChannel').innerText = name;

        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            video.src = url;
            video.play();
        }
    }

    loadFromURL();
</script>
