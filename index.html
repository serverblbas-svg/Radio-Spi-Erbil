<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <title>QURAN LIVE - BRAVE AD-BLOCK 🌙</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        /* پلەیەری یوتیوب بە شاشەی کامل */
        .video-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        iframe {
            width: 100%; height: 100%;
            border: none;
            pointer-events: none; /* بۆ ئەوەی کەس نەتوانێت دەستکاری ڤیدیۆکە بکات لە کاتی پەخش */
        }

        /* لۆگۆی کەناڵ بە بڕینی ڕەنگی سەوز */
        #logoCanvas {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 160px; /* دەتوانیت قەبارەکەی لێرە بگۆڕیت */
            z-index: 100;
            pointer-events: none;
            filter: drop-shadow(0 0 8px rgba(0,0,0,0.5));
        }

        #hiddenLogoVideo { display: none; }

        /* چینێکی پارێزەر لەسەر ڤیدیۆکە */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="video-wrapper">
        <iframe 
            src="http://tv.ezanvaktipro.com/hls/quran.m3u8" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>
    </div>

    <canvas id="logoCanvas"></canvas>
    <video id="hiddenLogoVideo" crossorigin="anonymous" autoplay loop muted playsinline>
        <source src="https://dso5.raed.net:452/files/111dekanquran.mkv" type="video/mkv">
    </video>

<script>
    const logoVideo = document.getElementById('hiddenLogoVideo');
    const canvas = document.getElementById('logoCanvas');
    const ctx = canvas.getContext('2d');

    // لۆژیکی بڕینی ڕەنگی سەوز (Chroma Key)
    function processChromaKey() {
        if (!logoVideo.paused && !logoVideo.ended) {
            ctx.drawImage(logoVideo, 0, 0, canvas.width, canvas.height);
            let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let length = frame.data.length / 4;

            for (let i = 0; i < length; i++) {
                let r = frame.data[i * 4 + 0];
                let g = frame.data[i * 4 + 1];
                let b = frame.data[i * 4 + 2];

                // بڕینی ڕەنگی سەوز و گۆڕینی بۆ شەفاف
                if (g > 90 && g > r * 1.2 && g > b * 1.2) {
                    frame.data[i * 4 + 3] = 0;
                }
            }
            ctx.putImageData(frame, 0, 0);
        }
        requestAnimationFrame(processChromaKey);
    }

    logoVideo.addEventListener('play', () => {
        canvas.width = logoVideo.videoWidth;
        canvas.height = logoVideo.videoHeight;
        processChromaKey();
    });

    // بۆ دڵنیایی لەوەی ڤیدیۆکە خۆی دەستپێدەکات
    window.onload = () => {
        logoVideo.play();
    };
</script>
</body>
</html>
